<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projetos</title>
</head>
<body>
    <h1>Projetos cadastrados</h1>

    <p>
        <a href="{% url 'novo_projeto' %}">
            Cadastrar novo projeto
        </a>
    </p>

    {% if projetos %}
        <ul>
            {% for projeto in projetos %}
                <li>
                    <strong>{{ projeto.nome }}</strong><br>
                    {{ projeto.descricao }}<br>
                    Data de início: {{ projeto.data_inicio }}<br>

                    <a href="{% url 'editar_projeto' projeto.pk %}">
                        Editar
                    </a>

                    |

                    <a href="{% url 'excluir_projeto' projeto.pk %}">
                        Excluir
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Nenhum projeto cadastrado ainda.</p>
    {% endif %}
</body>
</html>
