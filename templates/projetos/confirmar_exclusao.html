<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar exclusão</title>
</head>
<body>
    <h1>Excluir projeto</h1>

    <p>
        Tem certeza de que deseja excluir o projeto
        <strong>{{ projeto.nome }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">
            Sim, excluir projeto
        </button>
    </form>

    <p>
        <a href="{% url 'lista_projetos' %}">
            Não, voltar para a lista
        </a>
    </p>
</body>
</html>
