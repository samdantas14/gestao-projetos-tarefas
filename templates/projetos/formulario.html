<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% if projeto %}
            Editar projeto
        {% else %}
            Cadastrar projeto
        {% endif %}
    </title>
</head>
<body>
    {% if projeto %}
        <h1>Editar projeto</h1>
    {% else %}
        <h1>Cadastrar projeto</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Salvar
        </button>
    </form>

    <p>
        <a href="{% url 'lista_projetos' %}">
            Cancelar e voltar para a lista
        </a>
    </p>
</body>
</html>
