<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar projeto</title>
</head>
<body>
    <h1>Cadastrar projeto</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Salvar projeto</button>
    </form>

    <p>
        <a href="{% url 'lista_projetos' %}">
            Voltar para a lista
        </a>
    </p>
</body>
</html>
